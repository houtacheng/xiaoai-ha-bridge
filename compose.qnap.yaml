services:
  xiaoai-ha-bridge:
    image: xiaoai-ha-bridge:ai01zm-experimental
    container_name: xiaoai-ha-bridge-ai01zm
    restart: unless-stopped
    ports:
      - "47521:47521"
    volumes:
      - /share/Container/xiaoai-ha-bridge/config:/app/config
      - /share/Container/xiaoai-ha-bridge/logs:/app/logs
    environment:
      TZ: America/New_York
      PYTHONUNBUFFERED: "1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
